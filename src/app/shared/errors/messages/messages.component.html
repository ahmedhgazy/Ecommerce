<ng-container *ngIf="errors$ | async as errors">
    <div class="overlay" *ngIf="showMessages">
        <div class="messages-container" *ngIf="showMessages">
            <div class="message" *ngFor="let error of errors">
                {{ "ERROR.errorMessage" | translate }}
            </div>

            <div class="close__btn bg-danger p-2">
                <button class="btn btn-close" (click)="onClose()"></button>
            </div>
        </div>
    </div>
</ng-container>
