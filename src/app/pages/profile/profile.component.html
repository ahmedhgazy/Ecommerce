<section class="profile-page">
    <div class="container">
        <!-- Page Header -->
        <div class="page-header">
            <div class="breadcrumb">
                <a routerLink="/home">{{ 'ROUTES.HOME' | translate }}</a>
                <span class="separator">/</span>
                <span class="current">{{ 'ROUTES.PROFILE' | translate }}</span>
            </div>
            <h1 class="display-6 fw-bold text-dark">My Account</h1>
        </div>

        <div class="dashboard-container">
            <!-- Sidebar -->
            <aside class="dashboard-sidebar">
                <div class="sidebar-section">
                    <h5 class="section-title">
                        {{ 'PROFILE.MANAGE_ACCOUNT' | translate }}
                    </h5>
                    <div class="nav-links">
                        <a
                            routerLink="/profile"
                            class="p-2"
                            routerLinkActive="active-link"
                            [routerLinkActiveOptions]="{ exact: true }"
                        >
                            <i class="pi pi-user"></i>
                            {{ 'PROFILE.YOUR_PROFILE' | translate }}
                        </a>
                    </div>
                </div>

                <div class="sidebar-section">
                    <h5 class="section-title">
                        {{ 'PROFILE.MY_ORDERS' | translate }}
                    </h5>
                    <div class="nav-links">
                        <a
                            routerLink="/profile/orders"
                            routerLinkActive="active-link"
                            class="p-2"
                        >
                            <i class="pi pi-box"></i>
                            {{ 'PROFILE.YOUR_ORDERS' | translate }}
                        </a>
                        <a
                            routerLink="/profile/wishlist"
                            routerLinkActive="active-link"
                            class="p-2"
                        >
                            <i class="pi pi-heart"></i>
                            {{ 'PROFILE.YOUR_WISHLIST' | translate }}
                        </a>
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="dashboard-content">
                <router-outlet></router-outlet>
            </main>
        </div>
    </div>
</section>
