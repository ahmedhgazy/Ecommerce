<div class="auth-container">
    <div class="auth-wrapper glass-card">
        <!-- Left Side: Image -->
        <div class="auth-image-side d-none d-lg-block">
            <div class="image-overlay">
                <div class="overlay-content">
                    <h2 class="brand-title">Join Exclusive</h2>
                    <p class="brand-tagline">Start your premium journey today</p>
                </div>
            </div>
            <img src="assets/images/auth-premium.png" alt="Premium Auth Background">
        </div>

        <!-- Right Side: Form -->
        <div class="auth-form-side" animateFromRight>
            <div class="form-content text-start">
                 <div class="text-start mb-4">
                    <h1 class="auth-title gradient-text">{{ "REGISTER.CREATE_ACCOUNT" | translate }}</h1>
                    <p class="auth-subtitle text-muted mt-2">
                        {{ "REGISTER.ENTER_DETAILS_BELOW" | translate }}
                    </p>
                </div>

                <form [formGroup]="form" (ngSubmit)="submit()" class="d-flex flex-column gap-3">
                     <!-- Error Alert -->
                    <div *ngIf="error" class="alert alert-danger d-flex align-items-center justify-content-between p-3 rounded-3 mb-3">
                        <span class="small">{{ error }}</span>
                        <button type="button" class="btn-close btn-close-white small" (click)="cancelError()"></button>
                    </div>

                    <div class="form-group">
                        <input class="form-control-premium w-100" formControlName="firstName" type="text"
                            placeholder="{{ 'REGISTER.FIRST_NAME' | translate }}" />
                    </div>

                    <div class="form-group">
                        <input class="form-control-premium w-100" formControlName="lastName" type="text"
                            placeholder="{{ 'REGISTER.LAST_NAME' | translate }}" />
                    </div>

                    <div class="form-group">
                        <input class="form-control-premium w-100" formControlName="email" type="email"
                            placeholder="{{ 'REGISTER.EMAIL' | translate }}" />
                    </div>

                    <div class="form-group">
                        <input class="form-control-premium w-100" type="password" formControlName="password"
                            placeholder="{{ 'REGISTER.PASSWORD' | translate }}" />
                    </div>

                    <button type="submit" class="btn-premium w-100 mt-2">
                        {{ "REGISTER.CREATE_ACCOUNT_BUTTON" | translate }}
                    </button>

                    <!-- Google Auth -->
                    <button type="button" class="btn-premium-outline w-100 d-flex align-items-center justify-content-center gap-2 mt-2" (click)="authWgoo()">
                        <i class="pi pi-google text-danger fs-5"></i>
                        <span>{{ 'REGISTER.SIGN_UP_GOOGLE' | translate }}</span>
                    </button>

                    <div class="signup-link text-center mt-3">
                        <p class="text-muted small">
                            {{ "REGISTER.ALREADY_HAVE_ACCOUNT" | translate }}
                            <a [routerLink]="['/auth/login']" class="register-link fw-bold ms-1">
                                {{ "REGISTER.LOGIN" | translate }}
                            </a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<p-toast />
