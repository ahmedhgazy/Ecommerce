<section class="reset-password" style="margin-top: 1.9rem">
    <div class="container">
        <div class="row g-0">
            <div class="col-12 col-md-6 text-center img_container-colDiv d-flex justify-content-center align-items-center"
                style="background-color: var(--bg-auth)">
                <img class="img-fluid" style="max-width: 90%" src="../../../../assets/images/rgstr.png"
                    alt="Reset Password" />
            </div>
            <div class="col-md-4 col-12 offset-md-1" style="flex: 1 1 auto">
                <!-- Success State -->
                <div *ngIf="isSuccess" class="success-area d-flex flex-column justify-content-center">
                    <div class="text-center">
                        <i class="pi pi-check-circle" style="font-size: 4rem; color: #22c55e"></i>
                        <h2 class="mt-4">Password Reset Successful!</h2>
                        <p class="mt-3">
                            Your password has been reset successfully.
                        </p>
                        <p>Redirecting you to login...</p>
                    </div>
                </div>

                <!-- Error State (Invalid Link) -->
                <div *ngIf="error && !token" class="error-area d-flex flex-column justify-content-center">
                    <div class="text-center">
                        <i class="pi pi-times-circle" style="font-size: 4rem; color: #ef4444"></i>
                        <h2 class="mt-4">Invalid Reset Link</h2>
                        <p class="mt-3">{{ error }}</p>
                        <a routerLink="/auth/login" class="btn btn-primary mt-4">Go to Login</a>
                    </div>
                </div>

                <!-- Form State -->
                <div *ngIf="!isSuccess && token" class="reset-area d-flex flex-column justify-content-center">
                    <div class="auth-header">
                        <h1>{{ 'REGISTER.RESET_PASSWORD' | translate }}</h1>
                        <p class="mt-4">Enter your new password below</p>
                    </div>

                    <div *ngIf="error" class="alert alert-danger mb-4">
                        {{ error }}
                    </div>

                    <form [formGroup]="form" (ngSubmit)="submit()">
                        <div class="form-group mb-4">
                            <input type="password" formControlName="newPassword" placeholder="New Password"
                                class="form-control" />
                            <small
                                *ngIf="form.get('newPassword')?.touched && form.get('newPassword')?.errors?.['minlength']"
                                class="text-danger">
                                Password must be at least 6 characters
                            </small>
                        </div>
                        <div class="form-group mb-4">
                            <input type="password" formControlName="confirmPassword" placeholder="Confirm Password"
                                class="form-control" />
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mb-3" [disabled]="isLoading">
                            <span *ngIf="!isLoading">Reset Password</span>
                            <span *ngIf="isLoading">
                                <i class="pi pi-spin pi-spinner"></i>
                                Resetting...
                            </span>
                        </button>
                        <div class="text-center">
                            <a routerLink="/auth/login" class="text-secondary">
                                Back to Login
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
<p-toast />
