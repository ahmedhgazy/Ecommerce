<div class="popup">
    <div class="container popup-container">
        <p-toast></p-toast>
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div
                    class="popup__content-wrapper bg-white rounded-4 shadow-lg overflow-hidden"
                >
                    <div
                        class="popup-header bg-light p-3 d-flex justify-content-between align-items-center"
                    >
                        <h5
                            style="flex: 1 1 auto !important"
                            class="text-dark mb-0 text-center"
                        >
                            {{ "WISHLIST.addToSavedItems" | translate }}
                        </h5>
                        <button
                            class="btn-close"
                            aria-label="Close"
                            (click)="close()"
                        ></button>
                    </div>
                    <div class="popup-body p-4">
                        <div class="text-center mb-4">
                            <div class="product-image-container mb-3">
                                <img
                                    class="img-fluid rounded-3 shadow-sm"
                                    [src]="product.img"
                                    alt="{{ product.name }}"
                                />
                            </div>
                            <p class="fs-5 fw-semibold text-secondary">
                                {{ product.name }}
                            </p>
                        </div>
                        <div class="d-grid">
                            <button
                                class="btn btn-primary btn-lg rounded-pill"
                                (click)="SaveItem()"
                            >
                                <i class="pi pi-heart-fill me-2"></i>
                                {{ "WISHLIST.addToWishlist" | translate }}
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
