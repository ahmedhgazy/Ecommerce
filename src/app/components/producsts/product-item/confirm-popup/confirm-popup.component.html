<div class="modal-premium">
    <div class="modal-header border-0 pb-0">
        <button type="button" class="btn-close-premium ms-auto" aria-label="Close" (click)="close()">
            <i class="pi pi-times"></i>
        </button>
    </div>

    <div class="modal-body text-center pt-0 pb-4 px-4">
        <div class="product-preview mb-4">
             <img class="rounded-3 shadow-sm" [src]="product.imageUrl || 'assets/placeholder.png'" [alt]="product.name" />
        </div>

        <h5 class="modal-title mb-2">{{ "WISHLIST.addToSavedItems" | translate }}?</h5>
        <p class="text-muted mb-4">{{ product.name }}</p>

        <div class="d-grid gap-2">
            <button class="btn btn-premium w-100" (click)="SaveItem()">
                <i class="pi pi-heart-fill me-2"></i>
                {{ "WISHLIST.addToWishlist" | translate }}
            </button>
            <button class="btn btn-link text-muted" (click)="close()">
                {{ "ACTIONS.CANCEL" | translate }}
            </button>
        </div>
    </div>
</div>
