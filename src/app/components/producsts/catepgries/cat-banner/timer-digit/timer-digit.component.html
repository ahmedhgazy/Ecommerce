<div class="timer-digit-container bg-white text-dark rounded-circle me-md-3 me-2 mb-3">
    <div class="digit-viewport">
        <div class="digit-track" [class.animate]="isAnimating()">
            <p class="mb-0 digit new">{{ currentValue() }}</p>
            <p class="mb-0 digit old">{{ previousValue() }}</p>
        </div>
    </div>
    <span>{{ label | translate }}</span>
</div>
